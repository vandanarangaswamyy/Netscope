[project]
name = "cloud-network-reliability-lab"
version = "0.1.0"
description = "A production-style cloud network reliability lab for distributed database platforms."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116.0",
    "prometheus-client>=0.22.0",
    "pydantic-settings>=2.8.0",
    "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.4.0",
]

[tool.pytest.ini_options]
testpaths = ["services/dbnode/tests"]
pythonpath = ["services/dbnode"]
